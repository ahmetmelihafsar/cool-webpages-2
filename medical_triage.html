<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Triage</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/medical_triage.css">
</head>
<body>
    <header>
        <h1>STEM Unit - Medical Bay</h1>
        <nav>
            <a href="index.html" id="back-to-index">&larr; Back to Dashboard</a>
        </nav>
    </header>

    <main id="triage-interface">
        <!-- Main area for the 3D canvas -->
        <div id="canvas-container">
            <canvas id="triage-canvas"></canvas>
        </div>

        <!-- Sidebar for HUD, actions, and labels -->
        <aside id="sidebar">
            <section id="vitals-hud" class="sidebar-section">
                <h2>Vitals HUD <span style="font-size: 0.8em; color: var(--color-secondary-text);">// DESIGNATION: ZEUS</span></h2>
                <div class="vital-item">
                    <span class="vital-label">Heart Rate:</span>
                    <span id="hud-heart-rate" class="vital-value">-- bpm</span>
                </div>
                <div class="vital-item">
                    <span class="vital-label">SpO₂:</span>
                    <span id="hud-spo2" class="vital-value">-- %</span>
                </div>
                <div class="vital-item">
                    <span class="vital-label">Life %:</span>
                    <span id="hud-life-percent" class="vital-value">-- %</span>
                </div>
            </section>

            <section id="treatment-grid" class="sidebar-section">
                <h2>Treatment Actions</h2>
                <div id="action-buttons">
                    <button class="action-btn" data-action="irrigate">Irrigate</button>
                    <button class="action-btn" data-action="debris">Debris Removal</button>
                    <button class="action-btn" data-action="pain_med">Pain Medicine</button>
                    <button class="action-btn" data-action="suture">Suture</button>
                    <button class="action-btn" data-action="bandage">Bandage</button>
                    <!-- Pagination might be added here later -->
                </div>
            </section>

            <section id="injury-labels" class="sidebar-section">
                <h2>Injury Points</h2>
                <ul id="injury-list">
                    <!-- Populated by JS -->
                    <li><span class="injury-marker">A</span> Head Trauma (Stub)</li>
                    <li><span class="injury-marker">B</span> Laceration - Arm (Stub)</li>
                </ul>
            </section>
<section id="log-display" class="sidebar-section">
                <h2>Event Log</h2>
                <div id="log-entries">
                    <!-- Log entries will be populated by JS -->
                    <p>Initializing system...</p>
                </div>
            </section>
        </aside>
    </main>

    <footer>
        <span>&copy; 2025 STEM Tactical Interface</span>
    </footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script src="js/main.js"></script>
    <script src="js/medical_triage.js"></script>

    <!-- Overlay Controls -->
    <div id="view-controls">
        <button id="toggle-axes" class="control-btn">Toggle Axes</button>
    </div>
</body>
</html>
